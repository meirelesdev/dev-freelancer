<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Ícones - Dev Freelancer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2563EB 0%, #1E3A8A 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2563EB;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .preview-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .preview-item {
            text-align: center;
        }

        .preview-item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        canvas {
            border: 3px solid #2563EB;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            background: #2563EB;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            background: #1E40AF;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            background: #F4F7F6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .info strong {
            color: #2563EB;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💻 Dev Freelancer</h1>
        <p class="subtitle">Gerador de Ícones PWA</p>

        <div class="preview-container">
            <div class="preview-item">
                <h3>192x192</h3>
                <canvas id="icon192" width="192" height="192"></canvas>
            </div>
            <div class="preview-item">
                <h3>512x512</h3>
                <canvas id="icon512" width="512" height="512"></canvas>
            </div>
        </div>

        <div class="button-group">
            <button onclick="downloadIcon('icon192', 'icon-192.png')">💾 Baixar 192x192</button>
            <button onclick="downloadIcon('icon512', 'icon-512.png')">💾 Baixar 512x512</button>
            <button onclick="downloadAll()">💾 Baixar Todos</button>
        </div>

        <div class="info">
            <strong>📋 Instruções:</strong><br>
            1. Visualize os ícones acima<br>
            2. Clique em "Baixar Todos" para salvar ambos os ícones<br>
            3. Coloque os arquivos <strong>icon-192.png</strong> e <strong>icon-512.png</strong> na raiz do projeto (mesma pasta do index.html)<br>
            4. Recarregue a aplicação (F5)
        </div>
    </div>

    <script>
        // Cores do tema Dev Freelancer
        const colors = {
            primary: '#2563EB',      // Azul principal
            secondary: '#1E40AF',    // Azul escuro
            accent: '#3B82F6',       // Azul claro
            dark: '#1E3A8A',         // Azul muito escuro
            white: '#FFFFFF',
            code: '#10B981'          // Verde para símbolo de código
        };

        function createIcon(canvas, size) {
            const ctx = canvas.getContext('2d');

            // Fundo com gradiente radial
            const gradient = ctx.createRadialGradient(
                size * 0.3, size * 0.3, 0,
                size * 0.5, size * 0.5, size * 0.8
            );
            gradient.addColorStop(0, colors.primary);
            gradient.addColorStop(1, colors.dark);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Bordas arredondadas
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            const radius = size * 0.15;
            roundRect(ctx, 0, 0, size, size, radius);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            const centerX = size / 2;
            const centerY = size / 2;
            
            // Símbolo de código: < />
            ctx.strokeStyle = colors.white;
            ctx.fillStyle = colors.white;
            ctx.lineWidth = size * 0.06;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Desenha "<"
            const codeSize = size * 0.2;
            const codeY = centerY;
            ctx.beginPath();
            ctx.moveTo(centerX - codeSize * 0.3, codeY - codeSize * 0.4);
            ctx.lineTo(centerX - codeSize * 0.6, codeY);
            ctx.lineTo(centerX - codeSize * 0.3, codeY + codeSize * 0.4);
            ctx.stroke();
            
            // Desenha "/"
            ctx.beginPath();
            ctx.moveTo(centerX - codeSize * 0.1, codeY - codeSize * 0.5);
            ctx.lineTo(centerX + codeSize * 0.1, codeY + codeSize * 0.5);
            ctx.stroke();
            
            // Desenha ">"
            ctx.beginPath();
            ctx.moveTo(centerX + codeSize * 0.3, codeY - codeSize * 0.4);
            ctx.lineTo(centerX + codeSize * 0.6, codeY);
            ctx.lineTo(centerX + codeSize * 0.3, codeY + codeSize * 0.4);
            ctx.stroke();
            
            // Adiciona ponto decorativo verde (representando código)
            ctx.fillStyle = colors.code;
            ctx.beginPath();
            ctx.arc(centerX, centerY + size * 0.25, size * 0.04, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAll() {
            downloadIcon('icon192', 'icon-192.png');
            setTimeout(() => {
                downloadIcon('icon512', 'icon-512.png');
            }, 300);
        }

        // Gera os ícones ao carregar a página
        window.addEventListener('load', () => {
            createIcon(document.getElementById('icon192'), 192);
            createIcon(document.getElementById('icon512'), 512);
        });
    </script>
</body>
</html>
